name: Validate WDL

on:
  push:
    branches: [main, dev]
    paths:
      - 'assembly/workflows/**'
      - 'assembly/docker/check_images.sh'
      - 'evaluation/workflows/**'
      - 'evaluation/docker/check_images.sh'
      - 'end_to_end/workflows/**'
      - 'scripts/registry_lib.sh'
      - 'scripts/input_generation_common.py'
      - 'scripts/fetch_resources.py'
      - 'scripts/tests/**'
      - '.github/workflows/validate-wdl.yml'
  pull_request:
    paths:
      - 'assembly/workflows/**'
      - 'assembly/docker/check_images.sh'
      - 'evaluation/workflows/**'
      - 'evaluation/docker/check_images.sh'
      - 'end_to_end/workflows/**'
      - 'scripts/registry_lib.sh'
      - 'scripts/input_generation_common.py'
      - 'scripts/fetch_resources.py'
      - 'scripts/tests/**'
      - '.github/workflows/validate-wdl.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-assembly:
    name: miniwdl check (assembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install miniwdl
        run: pip install --disable-pip-version-check miniwdl

      # shellcheck is preinstalled on ubuntu-latest, so miniwdl additionally lints
      # each task's command block. Lint findings are reported but do not fail the
      # job; only real errors (type errors, broken imports, ...) do.
      - name: Check every WDL document
        run: |
          for f in assembly/workflows/*.wdl; do
            echo "::group::$f"
            miniwdl check "$f"
            echo "::endgroup::"
          done

  check-evaluation:
    name: miniwdl check (evaluation)
    runs-on: ubuntu-latest
    steps:
      # recursive: evaluation/workflows/assembly_evaluation.wdl imports the vendored
      # flagger submodule, and miniwdl check needs it actually checked out to resolve.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install miniwdl
        run: pip install --disable-pip-version-check miniwdl

      - name: Check every WDL document
        run: |
          for f in evaluation/workflows/*.wdl; do
            echo "::group::$f"
            miniwdl check "$f"
            echo "::endgroup::"
          done

  check-end-to-end:
    name: miniwdl check (end_to_end)
    runs-on: ubuntu-latest
    steps:
      # recursive: end_to_end_assembly.wdl imports assembly_evaluation.wdl, which imports
      # the vendored flagger submodule; miniwdl check needs it actually checked out to
      # resolve.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install miniwdl
        run: pip install --disable-pip-version-check miniwdl

      - name: Check every WDL document
        run: |
          for f in end_to_end/workflows/*.wdl; do
            echo "::group::$f"
            miniwdl check "$f"
            echo "::endgroup::"
          done

  images-assembly:
    name: Pinned container images exist (assembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every pinned container image is resolvable
        run: ./assembly/docker/check_images.sh

  images-evaluation:
    name: Pinned container images exist (evaluation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every pinned container image is resolvable
        run: ./evaluation/docker/check_images.sh

  test-evaluation:
    name: unit tests (evaluation scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run summarize_evaluation.py / generate_inputs.py unit tests
        run: python3 -m unittest discover -s evaluation/workflows/scripts/tests -v

  test-end-to-end:
    name: unit tests (end_to_end scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run generate_inputs.py unit tests
        run: python3 -m unittest discover -s end_to_end/workflows/scripts/tests -v

  test-shared-scripts:
    name: unit tests (shared scripts)
    runs-on: ubuntu-latest
    steps:
      # recursive: RealRepoConstantsTest checks input_generation_common.py's hardcoded
      # flagger/calN50 paths against what is actually vendored, which needs those submodules
      # checked out.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run input_generation_common.py / fetch_resources.py unit tests
        run: python3 -m unittest discover -s scripts/tests -v
